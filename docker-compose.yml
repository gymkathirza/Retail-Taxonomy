services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxonomy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxonomy}
      POSTGRES_DB: ${POSTGRES_DB:-taxonomy}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxonomy} -d ${POSTGRES_DB:-taxonomy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: retail-taxonomy-api:local
    environment:
      # Always use Compose DNS name inside the network (ignore host .env DATABASE_URL).
      DATABASE_URL: postgresql+psycopg://taxonomy:taxonomy@postgres:5432/taxonomy
      TAXONOMY_SEED_CSV: /data/seed/taxonomy.csv
      DEMO_USER: ${DEMO_USER:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password}
      # OAuth2/OIDC — enabled by default against local Keycloak.
      # Issuer is the browser-facing URL (token `iss`); JWKS uses Compose DNS.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/retail}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-retail-taxonomy-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/retail/protocol/openid-connect/certs}
      OIDC_REQUIRED_SCOPE: ${OIDC_REQUIRED_SCOPE:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./scripts:/app/scripts
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: retail-taxonomy-web:local
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://api:8000
      # OAuth2/OIDC — SPA SSO + social buttons (via Keycloak) on by default.
      - VITE_OIDC_AUTHORITY=${VITE_OIDC_AUTHORITY:-http://localhost:8080/realms/retail}
      - VITE_OIDC_CLIENT_ID=${VITE_OIDC_CLIENT_ID:-retail-taxonomy-spa}
      # Request only `openid` — custom taxonomy.* scopes are attached by Keycloak defaults.
      - VITE_OIDC_SCOPE=${VITE_OIDC_SCOPE:-openid}
      - VITE_OIDC_REDIRECT_URI=${VITE_OIDC_REDIRECT_URI:-http://localhost:5173/callback}
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Let clients view dashboards without logging in (read-only). Admin
      # login (admin/admin) is still required to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
    volumes:
      - ./docs/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./docs/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./docs/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
    depends_on:
      - prometheus

  # Local IdP (started with the default stack). Admin console: admin / admin.
  # Realm "retail" is imported from deploy/keycloak/realm-retail.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      [
        "start-dev",
        "--import-realm",
        "--http-port=8080",
        "--hostname=localhost",
        "--hostname-strict=false",
        "--http-enabled=true",
      ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_SPI_COOKIE_DEFAULT_SECURE: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
