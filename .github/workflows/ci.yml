name: ci

on:
  push:
    branches: [main, master, implement-assessment-mvp]
  pull_request:
    branches: [main, master]

jobs:
  unit-component-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taxonomy
          POSTGRES_PASSWORD: taxonomy
          POSTGRES_DB: taxonomy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxonomy -d taxonomy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://taxonomy:taxonomy@127.0.0.1:5432/taxonomy
      TAXONOMY_SEED_CSV: ${{ github.workspace }}/data/seed/taxonomy.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API deps
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements.txt
      - name: Migrate and seed
        working-directory: apps/api
        run: |
          .venv/bin/alembic upgrade head
          PYTHONPATH=. TAXONOMY_SEED_CSV=../../data/seed/taxonomy.csv .venv/bin/python ../../scripts/seed.py
      - name: Unit tests
        run: make test-unit
      - name: Component tests
        run: |
          npm --prefix apps/web ci
          make test-component
      - name: Integration tests
        run: |
          cd apps/api && PYTHONPATH=. .venv/bin/pytest tests/integration -v

  acceptance:
    runs-on: ubuntu-latest
    needs: unit-component-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api python /app/scripts/seed.py
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && curl -sf http://127.0.0.1:5173/ && break
            sleep 2
          done
      - name: Acceptance tests
        run: make test-acceptance
      - name: Teardown
        if: always()
        run: docker compose down -v
